<head>

<title>AudiLab · Simulador de Auditoria Informática</title>
<style>
:root{--bg:#f2f6fc;--card:#fff;--ink:#0d1a3a;--mut:#56638a;--ac:#0a1f8a;--onac:#fff;--acs:#e6eefb;--sun:#f39a1e;--sky:#0a7fd0;--ok:#18794e;--okb:#e1f5ea;--no:#b42318;--nob:#fde8e6;--ln:#d3dcee;--navy:#0a1f7a;--sh:0 1px 2px rgba(10,31,122,.07),0 4px 14px rgba(10,31,122,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#081034;--card:#0f1c4a;--ink:#e9eefc;--mut:#a3b0d6;--ac:#5db7f0;--onac:#06133d;--acs:#16286a;--sun:#ffb347;--sky:#5db7f0;--ok:#5fd39b;--okb:#11382b;--no:#ff8a80;--nob:#3d1c1c;--ln:#27397a;--navy:#061046;--sh:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3{margin:0 0 .6rem;line-height:1.25;letter-spacing:-.01em}
h1{font-size:clamp(1.35rem,4vw,1.9rem);font-weight:750}h2{font-size:clamp(1.25rem,3vw,1.55rem)}h3{font-size:1.05rem;font-weight:650}
header{border-bottom:4px solid var(--sun);background:linear-gradient(135deg,var(--navy),#0a5fb0);color:#fff;padding:1.2rem 1rem}
.hw{max-width:1180px;margin:auto;display:flex;gap:1rem 2rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
header h1{color:#fff;margin:0}header p{margin:.2rem 0 0;color:#c9d9e6;font-size:.95rem}
.st{min-width:240px;flex:0 1 320px}.st .bar{background:rgba(255,255,255,.22)}.st .bar i{background:linear-gradient(90deg,#5db7f0,#ffb347)}

.wrap{flex:1;display:flex;flex-direction:column;max-width:1180px;width:100%;margin:auto}
nav{position:sticky;top:0;z-index:9;background:var(--card);border-bottom:1px solid var(--ln);padding:.5rem}

nav button{flex:none;text-align:left;border:1px solid var(--ln);background:transparent;color:var(--ink);padding:.45rem .8rem;border-radius:8px;cursor:pointer;font:inherit;font-size:.88rem;font-weight:600;min-height:44px}
nav button small{display:block;font-weight:400;color:var(--mut);font-size:.74rem;white-space:nowrap}
nav button.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}nav button.on small{color:inherit;opacity:.85}
main{padding:1rem;min-width:0}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:1.1rem 1.2rem;margin:0 0 1rem;box-shadow:var(--sh)}
.case{background:var(--acs);border:1px solid var(--ln);border-left:4px solid var(--ac);border-radius:10px;padding:.9rem 1.1rem;margin:0 0 1rem}
button.b{background:var(--ac);color:var(--onac);border:1px solid var(--ac);padding:.55rem 1.05rem;border-radius:8px;font:inherit;font-weight:600;font-size:.92rem;cursor:pointer;margin:.45rem .4rem 0 0;min-height:42px;transition:filter .15s}
button.b:hover{filter:brightness(1.08)}button.b:disabled{opacity:.5;cursor:default}
button.b.s{background:transparent;color:var(--ac)}
button:focus-visible,select:focus-visible,input:focus-visible,label:focus-within,.o:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.o{display:flex;gap:.6rem;align-items:flex-start;padding:.65rem .8rem;border:1px solid var(--ln);border-radius:9px;margin:.4rem 0;cursor:pointer;background:var(--card);transition:background .15s,border-color .15s}
.o:hover{border-color:var(--ac)}.o input{margin-top:.3rem;accent-color:var(--ac)}
.o.sel{background:var(--acs);border-color:var(--ac)}.o.r{background:var(--okb);border-color:var(--ok)}.o.w{background:var(--nob);border-color:var(--no)}
.fb{margin-top:.8rem;padding:.75rem .9rem;border-radius:9px;background:var(--acs);font-size:.94rem;border:1px solid var(--ln)}
.fb b.ok{color:var(--ok)}.fb b.no,.no{color:var(--no)}
.sc{overflow-x:auto;margin:.6rem 0;border:1px solid var(--ln);border-radius:9px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:.5rem .7rem;text-align:left;border-bottom:1px solid var(--ln)}th{background:var(--acs);white-space:nowrap;font-weight:650}
tr:last-child td{border-bottom:0}tbody tr:nth-child(even) td{background:rgba(127,150,170,.06)}
select,input{font:inherit;padding:.5rem .6rem;background:var(--card);color:var(--ink);border:1px solid var(--ln);border-radius:8px;max-width:100%;min-height:42px}
.cl{display:flex;gap:.6rem;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px dashed var(--ln);flex-wrap:wrap}
.cl input{flex:1 1 150px}
.num{font-variant-numeric:tabular-nums}
.bar{height:10px;background:var(--ln);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--sun));width:0;transition:width .4s}
.tag{display:inline-block;padding:.1rem .55rem;border-radius:99px;background:var(--acs);border:1px solid var(--ln);font-size:.78rem;font-weight:600;margin:.1rem 0}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:1.2rem}
@media(min-width:960px){
.wrap{flex-direction:row;align-items:flex-start;gap:1.2rem;padding:1.2rem 1rem}
nav{position:sticky;top:1rem;flex:0 0 260px;border:1px solid var(--ln);border-radius:12px;box-shadow:var(--sh)}
nav div{flex-direction:column;overflow:visible}nav button{width:100%}
main{flex:1;padding:0}}
@media(max-width:600px){main{padding:.75rem}.card{padding:.9rem}.cl>span,.cl select{flex:1 1 100%;width:100%}button.b{flex:1 1 auto}.st{flex-basis:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{nav,button{display:none!important}header{background:none;color:#000}}
.how{background:var(--acs);border:1px dashed var(--ac);border-radius:10px;padding:.8rem 1rem;margin:0 0 1rem;font-size:.95rem}.ins{color:var(--mut);font-size:.9rem;margin:.1rem 0 .5rem}summary{cursor:pointer;font-weight:650;margin-bottom:.4rem}details ul,details ol,.card ul,.card ol{padding-left:1.2rem;margin:.4rem 0 .8rem}li{margin:.25rem 0}.lab{border-top:4px solid var(--ac);position:relative}
.lab::before{content:"Laboratório prático";display:inline-block;font-size:.75rem;font-weight:700;color:var(--onac);background:var(--ac);padding:.1rem .6rem;border-radius:99px;margin-bottom:.6rem}
.how{border-style:solid;border-width:1px 1px 1px 4px}
.tb{display:flex;flex-wrap:wrap;gap:.8rem 1.2rem;align-items:flex-end;justify-content:space-between;margin-bottom:.9rem}
.chips{display:flex;gap:.4rem;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:.25rem;font-size:.82rem;font-weight:600;color:var(--mut);min-width:0}.fld select,.fld input{font-weight:400;color:var(--ink)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.7rem;margin:.6rem 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.6rem;margin:.4rem 0 1rem}
.tile2{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:.6rem .8rem;display:flex;flex-direction:column}.tile2 b{font-size:1.35rem;line-height:1.2;font-variant-numeric:tabular-nums}.tile2 span{font-size:.78rem;color:var(--mut)}
.tabs{display:flex;gap:.2rem;overflow-x:auto;border-bottom:2px solid var(--ln);margin-bottom:.8rem}
.tab{flex:none;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:.6rem .9rem;font:inherit;font-weight:600;font-size:.92rem;color:var(--mut);cursor:pointer;min-height:44px}
.tab:hover{color:var(--ink)}.tab.on{color:var(--ac);border-bottom-color:var(--ac)}.tab:focus-visible{outline:3px solid var(--ac);outline-offset:-3px}
.acts{display:flex;flex-wrap:wrap;gap:.2rem}
.al{margin-top:.8rem;padding:.7rem .9rem;border-radius:9px;background:var(--acs);border:1px solid var(--ac);border-left-width:4px;font-size:.94rem}
.sev{flex:none;font-size:.74rem;font-weight:700;padding:.1rem .55rem;border-radius:99px;margin-top:.1rem}.sev.hi{background:var(--no);color:var(--bg)}.sev.md{background:var(--sun);color:#1a1200}
.ms{counter-reset:m;list-style:none;padding:0!important}.ms li{counter-increment:m;position:relative;padding:.6rem .8rem .6rem 3rem;border:1px solid var(--ln);border-radius:9px;margin:.4rem 0}
.ms li::before{content:counter(m);position:absolute;left:.8rem;top:.55rem;width:1.7rem;height:1.7rem;border-radius:50%;background:var(--ac);color:var(--onac);font-weight:700;display:grid;place-items:center;font-size:.9rem}
.tg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.6rem;margin:.4rem 0 .6rem}
button.tile{text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--ln);border-radius:10px;padding:.8rem 1rem;cursor:pointer;font:inherit;min-height:64px;transition:border-color .15s,background .15s}
button.tile:hover{border-color:var(--ac);background:var(--acs)}button.tile b{display:block}button.tile small{color:var(--mut)}
#wg,#lab{scroll-margin-top:5rem}
@media(min-width:720px){#wg{display:grid;grid-template-columns:1fr 1fr;gap:0 .8rem;align-items:start}#wg>h3,#wg>p,#wg>.bar,#wg>.fb,#wg>#ro,#wg>#rt,#wg>.cl,#wg>button,#wg>#go,#wg>div:not(.o){grid-column:1/-1}#wg>.o{margin:.3rem 0}}
#rt{font-size:1.05rem}#wg .bar{height:16px!important}#pv{display:none}#pv table{border-collapse:collapse;width:100%}#pv th,#pv td{border:1px solid #888;padding:.4rem;text-align:left}@media print{body>*:not(#pv){display:none!important}#pv{display:block;color:#000;background:#fff}}.br{display:flex;align-items:center;gap:.9rem;min-width:0}.logo{height:64px;width:64px;object-fit:contain;background:#fff;border-radius:14px;padding:5px;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}header h1{letter-spacing:.01em}.tab.on{border-bottom-color:var(--sun);color:var(--ink)}nav button.on{box-shadow:inset 4px 0 0 var(--sun)}.lab::before{background:var(--sky)}
header,footer,.wrap{padding-left:max(1rem,env(safe-area-inset-left));padding-right:max(1rem,env(safe-area-inset-right))}
@media(max-width:600px){.logo{height:52px;width:52px}.hw{gap:.8rem}header p{font-size:.85rem}}@media(max-width:380px){h1{font-size:1.25rem}.tab{padding:.5rem .6rem}.card{padding:.8rem}.tiles{grid-template-columns:1fr 1fr}}
@media(min-width:600px) and (max-width:959px){nav div{justify-content:flex-start}main{padding:1.2rem}}
/* ===== Otimização mobile ===== */
html,body{overflow-x:hidden}
body{min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
button,.o,.tab,select,label{touch-action:manipulation}
.card,.case,.how,.fb,.al,.o span{overflow-wrap:anywhere}
pre.fb{overflow-x:auto}
.sc{-webkit-overflow-scrolling:touch}
footer{padding-bottom:max(1.2rem,env(safe-area-inset-bottom))}
@media(hover:none){button.b:hover{filter:none}.o:not(.sel):not(.r):not(.w):hover{border-color:var(--ln)}button.tile:hover{border-color:var(--ln);background:var(--card)}}
@media(max-width:959px){
 .wrap{padding-left:0;padding-right:0}
 nav{border-radius:0;border-left:0;border-right:0;box-shadow:0 2px 6px rgba(10,31,122,.08);padding:.4rem max(.5rem,env(safe-area-inset-left)) .4rem max(.5rem,env(safe-area-inset-right))}
 nav div{scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}
 nav div::-webkit-scrollbar{display:none}
 nav button{scroll-snap-align:center;padding:.4rem .75rem}
 main{padding:.75rem max(.75rem,env(safe-area-inset-left)) 1rem max(.75rem,env(safe-area-inset-right))}
 #wg,#lab,.card{scroll-margin-top:4.5rem}
}
@media(max-width:600px){
 body{font-size:15.5px}
 input,select,textarea{font-size:16px}
 header{padding-top:.8rem;padding-bottom:.8rem}
 header h1{font-size:1.3rem}
 h2{font-size:1.2rem}
 h3{font-size:1rem}
 .card,.case{border-radius:10px;margin-bottom:.8rem}
 .o{padding:.75rem .8rem;min-height:48px;gap:.7rem}
 .o input{width:22px;height:22px;flex:none;margin-top:.15rem}
 .cl{gap:.4rem}
 .cl select,.cl input{min-height:46px}
 .card>button.b{width:100%;margin:.5rem 0 0}
 .card>button.b.s[data-hn],.card>button.b.s[data-r]{width:calc(50% - .5rem)}
 .card>button.b.s[data-r]{margin-left:.5rem}
 .card>button.b[data-hn]+button.b[data-r]{margin-left:.5rem}
 .acts .b{flex:1 1 calc(50% - .3rem);margin:.3rem 0 0}
 .tiles{grid-template-columns:repeat(2,1fr)}
 .tile2 b{font-size:1.2rem}
 .tg{grid-template-columns:1fr}
 .fg{grid-template-columns:repeat(auto-fit,minmax(135px,1fr))}
 .fld input,.fld select{width:100%}
 .tb{flex-direction:column;align-items:stretch}
 .tb .fld select{width:100%}
 .tabs{scrollbar-width:none;scroll-snap-type:x proximity}
 .tabs::-webkit-scrollbar{display:none}
 .tab{scroll-snap-align:start;padding:.6rem .8rem}
 .sc table{min-width:460px}
 th,td{padding:.55rem .6rem}
 input[type=checkbox]{width:20px;height:20px}
 input[type=range]{width:100%;min-height:36px}
 .ms li{padding:.6rem .7rem .6rem 2.8rem}
 .sev{margin-top:.2rem}
}
@media(max-width:480px){nav button small{display:none}nav button{min-height:44px}}
@media(max-width:360px){.fg{grid-template-columns:1fr}.tiles{gap:.4rem}.tile2{padding:.5rem .6rem}}
@media(max-height:500px) and (orientation:landscape){header{padding:.5rem 1rem}.logo{height:40px;width:40px}header p{display:none}}
</style>

<body>
<header><div class="hw"><div class="br"><img class="logo" alt="UNISAVE"><div><h1>AudiLab</h1></div></div><div class="st"><div class="bar" aria-hidden="true"><i id="pb"></i></div><p class="sc2" id="tot"></p></div></div></header>
<div class="wrap"><nav aria-label="Módulos"><div id="nav"></div></nav><main id="m"></main></div>
<div id="pv"></div><footer>AudiLab · Simulador pedagógico de Auditoria Informática · Casos fictícios</footer>

<script>
/* ---------- Conteúdo ---------- */
const T=[
{n:"Tema 1",t:"Sistema e percurso dos dados",
 case:"<b>Cotab, Lda</b> (Chongoene) emite faturas em software certificado pela AT, mas recebe pagamentos por transferência, M-Pesa e numerário. O extrato M-Pesa é copiado todas as sextas-feiras pelo gerente financeiro para Excel e depois lançado na contabilidade.",
 it:[
 {k:"order",q:"Ordena o percurso de um pagamento M-Pesa, do cliente à demonstração financeira.",o:["Cliente paga por M-Pesa","Valor entra na conta M-Pesa da empresa","Gerente exporta o extrato (sexta-feira)","Copia para folha Excel","Lança manualmente na contabilidade","Saldo reflete-se no balanço"],w:"A pista de auditoria depende de duas etapas manuais (Excel e lançamento), onde se perdem ou alteram dados."},
 {k:"pick",q:"Seleciona os pontos onde um erro ou fraude passaria mais facilmente despercebido.",o:["Emissão da fatura certificada","Cópia do extrato para Excel","Lançamento manual na contabilidade","Pagamento recebido na conta M-Pesa","Intervalo de uma semana entre recebimento e registo"],a:[1,2,4],w:"Excel editável, lançamento manual e desfasamento semanal: sem validação automática, quem copia também pode omitir ou alterar."},
 {k:"single",q:"O registo semanal e manual aumenta o risco de auditoria?",o:["Não, o extrato é sempre fiável","Sim: há desfasamento, risco de omissão/erro e fraude por uma só pessoa","Só se o valor for superior a 50.000 MT","Não, porque o Excel é um sistema de controlo"],a:1,w:"Mais intervenção humana e menos rasto independente = maior risco. Um controlo simples: registo diário e reconciliação por pessoa diferente."},
 {k:"single",q:"Num ERP integrado, uma entrada de stock com quantidade errada pode chegar à contabilidade sem que a área financeira erre?",o:["Não, a contabilidade é separada","Sim: o ERP integra stocks e contabilidade automaticamente","Só se houver fraude","Só em empresas com Excel"],a:1,w:"A integração propaga o erro de origem; por isso o auditor segue o dado desde a origem em todas as áreas."}]},

{n:"Tema 2",t:"Controlo interno e segregação",
 case:"<b>NT Comércio, Lda</b> tem 4 funcionários administrativos. Analisa a matriz de utilizadores e perfis.",
 it:[
 {k:"pick",q:"Seleciona os utilizadores que violam a segregação de funções.",tb:["Utilizador","Criar fornecedor","Lançar fatura","Aprovar pagamento","Configuração"],tr:[["Assistente de contabilidade","Sim","Sim","Sim (até 50.000 MT)","Não"],["Gerente financeira","Não","Não","Sim (acima de 50.000 MT)","Sim"],["Funcionário de compras","Sim","Não","Não","Não"],["Receção","Não","Não","Não","Não"]],a:[0],w:"O assistente cria o fornecedor, lança a fatura e aprova o pagamento: ciclo completo sem segunda pessoa (fornecedor fictício)."},
 {k:"single",q:"Existe log automático, mas ninguém o revê. Isso resolve o problema?",o:["Sim, o log é prova suficiente","Não: um log sem revisão regular não deteta nada a tempo","Sim, desde que seja guardado 1 ano","Não é relevante para o controlo interno"],a:1,w:"O log só é controlo quando alguém o revê, com periodicidade e registo da revisão."},
 {k:"single",q:"A gerente partilha a sua senha com o assistente. Efeito na trilha de auditoria?",o:["Nenhum","Perde validade: já não se sabe quem realmente fez cada ação","Só afeta a configuração","Melhora a rastreabilidade"],a:1,w:"Perde-se a imputabilidade; um incidente já não pode ser atribuído a uma pessoa."},
 {k:"classify",q:"Classifica cada falha: controlo geral de TI (CGTI) ou controlo de aplicação (CA).",o:["Partilha de senha da gerente","Aprovação até 50.000 MT sem segunda validação","Log nunca revisto","Assistente com permissões de criar fornecedor e aprovar"],c:["CGTI","CA"],a:[0,1,0,0],w:"Senhas, logs e gestão de acessos são gerais de TI; limites de aprovação e validação no módulo são de aplicação. (A atribuição de perfis é discutível: justifica sempre.)"},
 {k:"single",q:"Sem orçamento para mais pessoal, qual é o melhor controlo compensatório?",o:["Confiar mais no assistente","Limite de aprovação baixo + revisão mensal do log pela gerente + revisão por contabilista externo","Contratar um auditor permanente","Remover os logs para poupar espaço"],a:1,w:"Compensa-se a falta de pessoas com limites, revisão independente e supervisão (princípio dos quatro olhos)."}]},

{n:"Tema 3",t:"CAATs: análise da população",lab:true,
 case:"<b>Cotab, Lda</b> entrega-te um ficheiro de pagamentos a fornecedores. O limite de aprovação sem segunda validação é 50.000 MT. Gera os dados, corre os testes e interpreta.",
 it:[
 {k:"order",q:"Ordena as fases de uma análise com CAATs.",o:["Definir o objetivo","Extrair os dados","Validar integridade (totais, completude)","Aplicar os testes","Interpretar e investigar os alertas"],w:"Saltar a validação produz conclusões erradas com aspeto de rigor."},
 {k:"single",q:"O teste aponta muitos pagamentos logo abaixo do limite. Isto prova fraude?",o:["Sim, é fatiamento","Não: é um red flag; investiga antes de concluir (pode haver preços tabelados)","Só se forem mais de 100","Sim, se o auditor confirmar com Excel"],a:1,w:"Indicador de alerta não é prova. Pede evidência adicional e comunica à gestão sem acusar."},
 {k:"classify",q:"Para cada observação, qual é a gravidade inicial mais plausível?",o:["37 possíveis duplicados","112 pagamentos entre 49.000 e 49.999","18 números de fatura em falta","NIB de fornecedor igual ao de um funcionário"],c:["Baixa/Média","Alta"],a:[0,0,0,1],w:"O NIB coincidente com um funcionário indicia conflito de interesses/fornecedor fictício; pede contrato, prova de entrega e ficha do fornecedor."}]},

{n:"Tema 4",t:"Segurança da informação",
 case:"<b>Nhamba Comércio, Lda</b>: dados só no PC do escritório, sem cópia externa; utilizador e senha únicos para todos; avaria no disco; corte de energia de 2 dias; um funcionário deu um código SMS a um falso técnico do banco.",
 it:[
 {k:"classify",q:"Classifica cada falha na tríade CIA.",o:["Senha única partilhada por todos","Sem cópia de segurança externa","Código SMS entregue ao falso técnico","Dois dias sem acesso ao sistema","Qualquer um pode alterar registos sem rasto"],c:["Confidencialidade","Integridade","Disponibilidade"],a:[0,2,0,2,1],w:"Backups e energia = disponibilidade; acesso indevido = confidencialidade; alteração sem rasto = integridade."},
 {k:"pick",q:"Seleciona medidas realistas e de baixo custo para esta semana.",o:["Cópia diária em disco externo/nuvem","Um utilizador por pessoa com senha própria","Comprar um data center","Formação rápida: nunca partilhar códigos recebidos","UPS (bateria de reserva) no computador principal"],a:[0,1,3,4],w:"Medidas baratas e imediatas resolvem a maior parte do risco."},
 {k:"pick",q:"Log: 6 logins falhados seguidos de sucesso às 03h00. Seleciona as explicações possíveis.",o:["Ataque de força bruta","Funcionário esqueceu a senha e trabalhou à noite (fecho)","Técnico externo em manutenção","Impossível haver explicação inocente"],a:[0,1,2],w:"É um red flag, não prova. Confirma com o titular da conta, escala de trabalho e IP de origem."}]},

{n:"Tema 5",t:"Fraude e red flags",

T[1].d={obj:["Definir controlo interno e distinguir controlos gerais de TI de controlos de aplicação","Explicar segregação de funções e reconhecer violações numa matriz de perfis","Propor controlos compensatórios para organizações com poucos recursos"],con:[["Controlo interno","Processos que garantem informação fiável, proteção dos ativos e cumprimento das normas."],["Controlos gerais de TI","Protegem o ambiente: acessos, senhas, backups, logs, gestão de alterações."],["Controlos de aplicação","Estão dentro do programa: validações, limites de aprovação, bloqueios."],["Segregação de funções","Quem cria, lança e aprova não pode ser a mesma pessoa."],["Princípio dos quatro olhos","Operações críticas exigem uma segunda pessoa."],["Controlo compensatório","Alternativa quando não há pessoas suficientes: limites, revisão do log, contabilista externo."]],lab:"Liga e desliga permissões e mexe no limite de aprovação. Observa a barra de risco. Desafio: chega abaixo de 30 sem contratar ninguém. O que mais reduz o risco: retirar permissões ou acrescentar supervisão?",sum:["Segregação de funções impede que uma só pessoa feche o ciclo da fraude.","Log sem revisão e senha partilhada anulam a trilha de auditoria.","Em PME, compensa-se com limites, revisão periódica e apoio externo."]};
T[2].d={obj:["Explicar o que são CAATs e porque analisam toda a população","Seguir as fases: objetivo, extração, validação, testes, interpretação","Aplicar testes básicos e reconhecer que um alerta exige investigação"],con:[["CAATs","Técnicas que usam o computador para analisar toda a população de transações."],["Amostragem","Testar só parte dos dados; continua útil quando a verificação é manual e demorada."],["Validação de dados","Confirmar completude e exatidão do ficheiro (nº de registos, totais) antes de testar."],["Red flag","Sinal de alerta que justifica investigação, mas não prova fraude."],["Falso positivo","Alerta com explicação inocente."]],lab:"1) Clica em cada teste e lê o número de alertas. 2) Repara na tabela de exemplos. 3) Lembra-te: um alerta pede investigação, não acusação. 4) Gera novos dados e compara. Depois responde às perguntas.",sum:["Analisar 100% dos dados encontra o que a amostra deixa escapar.","Sem validação do ficheiro, as conclusões podem estar erradas.","Alerta é ponto de partida: pede prova adicional."]};
T[3].d={obj:["Explicar a tríade CIA aplicada a dados financeiros","Identificar riscos comuns: sem backups, senhas partilhadas, engenharia social","Propor medidas de baixo custo e interpretar um log suspeito"],con:[["Tríade CIA","Confidencialidade (só quem deve vê), Integridade (não é alterado), Disponibilidade (acessível quando preciso)."],["Backup","Cópia fora do equipamento original; deve ser testada."],["Engenharia social","Enganar pessoas, não máquinas, para obter códigos ou senhas."],["ISO/IEC 27001","Norma para gerir de forma sistemática a segurança da informação."],["Log de acesso","Registo de quem entrou, quando e de onde."]],lab:"Liga uma medida de cada vez e vê qual incidente passa a ficar contido. Qual medida cobre mais riscos? Qual protege que pilar da tríade CIA?",sum:["Cada falha ameaça um pilar da tríade: identifica qual.","Medidas baratas (backup, UPS, senhas individuais, formação) resolvem muito.","A maior parte das fugas de informação vem de pessoas, não de hackers."]};
T[4].d={obj:["Distinguir erro de fraude","Reconhecer fornecedores fantasma, fatiamento e lançamentos fictícios","Usar o triângulo da fraude e agir com ética perante indícios"],con:[["Fraude vs erro","A fraude é intencional; o erro não."],["Triângulo da fraude","Pressão, oportunidade e racionalização."],["Fornecedor fantasma","Fornecedor fictício criado para desviar pagamentos."],["Fatiamento","Dividir um valor para ficar abaixo do limite de aprovação."],["Ceticismo profissional","Não aceitar explicações sem evidência."]],lab:"Clica nos elementos que levarias ao dossier. Meta: chegar a «indícios fortes» sem incluir as pistas irrelevantes. Lê a nota de cada elemento para perceber porque pesa (ou não).",sum:["Um red flag isolado não prova nada; vários combinados reforçam a suspeita.","A auditoria informática atua sobretudo na oportunidade.","Recolhe evidência com discrição e reporta ao nível certo, sem acusar."]};
T[5].d={obj:["Descrever as fases: planeamento, execução, relatório, follow-up","Estruturar um achado: condição, critério, causa, efeito, recomendação","Redigir recomendações acionáveis e adaptar a comunicação ao destinatário"],con:[["Achado","Facto estruturado em condição, critério, causa, efeito e recomendação."],["Recomendação acionável","Diz o quê, quem e quando."],["Evidência digital","Logs, extratos e ficheiros preservados sem alteração."],["Follow-up","Verificar depois se as recomendações foram aplicadas."],["Referenciais","COBIT, ITIL e ISO/IEC 27001 servem de critério."]],lab:"Escolhe a melhor formulação em cada campo, clica em «Gerar achado» e lê o feedback. Repete até obteres 5/5. Pensa: o gestor percebe o que tem de fazer?",sum:["Factos primeiro, opinião nunca; sem acusar pessoas.","Recomendação boa tem responsável e prazo.","Sem follow-up, o relatório não muda nada."]};
T[6].d={obj:["Aplicar na prática segregação de funções, limites e log","Ver como um auditor lê os dados que tu próprio geraste","Perceber porque a senha partilhada invalida a trilha de auditoria"],con:[["Perfil","Conjunto de permissões atribuído a um utilizador."],["Limite de aprovação","Valor até ao qual alguém aprova sozinho."],["Segunda validação","Outra pessoa tem de aprovar."],["Log","Registo automático das ações."]],lab:"1) Escolhe o utilizador ativo. 2) Cria fornecedor, lança fatura e processa pagamento. 3) Muda de perfil e vê o acesso negado. 4) Em Configuração (só a Gerente) muda as regras. 5) Vai a Modo auditor e lê os alertas. 6) Cumpre as missões no fim."};
T.push({n:"Glossário",t:"Conceitos e guia de estudo",gl:true,case:"Revê aqui todos os conceitos da disciplina e um método de estudo simples.",it:[]});
const H=[["Pensa: quem fez cada passo? Onde há Excel ou introdução manual de dados?","Procura etapas manuais e intervalos sem validação.","Compara: mais intervenção humana ou mais rasto independente?","Integrado significa que stocks e contabilidade partilham dados.","O número serve para validar o documento junto da AT."],["Procura quem tem «Sim» em criar, lançar e aprovar.","Um log só é controlo se alguém o lê.","Se duas pessoas usam a mesma senha, quem fez o quê?","Senhas e logs = geral. Limites e validações no módulo = aplicação.","Pensa em limites, revisão e supervisão externa.","Compara a lista de RH com os perfis atribuídos."],["Primeiro valida, depois testa.","Um red flag pede investigação, não acusação.","Fatiamento e NIB de funcionário pesam mais que falhas de numeração.","Testes simples: duplicados, datas, valores redondos, beneficiário."],["Pensa em backup, acesso e energia.","Soluções baratas e imediatas.","Alertas têm explicações inocentes: quais?","ISO 27001 é sobre gestão sistemática."],["Há quatro sinais combinados e uma pista irrelevante.","Oportunidade = o que o sistema permite.","Discrição, evidência, nível certo.","Cada esquema deixa um rasto diferente."],["Começa pelo facto e termina na ação.","Quem? O quê? Até quando?","Risco ativo de perda de dinheiro primeiro.","Descreve factos, não pessoas.","Original intacto; trabalha sobre cópia."]];
H.forEach((a,i)=>a.forEach((x,j)=>T[i].it[j].h=x));
const ins=(s,x)=>$(s).insertAdjacentHTML("beforebegin",`<div class="how"><b>Como fazer:</b> ${x}</div>`);
const prim=t=>{const g=S.cur==0?`<details class="card" open><summary>Como usar este simulador</summary><ol><li>Lê os <b>objetivos</b> e os <b>conceitos-chave</b> do módulo.</li><li>Lê o <b>caso</b> e experimenta o <b>laboratório</b>, se existir.</li><li>Responde às perguntas. Usa <b>Dica</b> se travares, depois <b>Verificar</b>.</li><li>Lê sempre a <b>explicação</b>: é aí que se aprende. Repete até acertares.</li><li>No fim, vê o <b>resumo</b>. Usa o separador <b>Glossário</b> para rever.</li></ol><p>As pontuações ficam guardadas neste navegador. O laboratório (mini-ERP) junta tudo o que aprendeste.</p></details>`:"";
 return g+`<details class="card" open><summary>Antes de começar: objetivos e conceitos</summary><b>No fim deste módulo deves saber:</b><ul>${t.d.obj.map(x=>`<li>${x}</li>`).join("")}</ul><b>Conceitos-chave:</b><ul>${t.d.con.map(c=>`<li><b>${c[0]}:</b> ${c[1]}</li>`).join("")}</ul></details>`};
const endc=t=>{const n=t.it.length,d=t.it.filter((_,b)=>best(S.cur,b)>0).length;return t.d.sum?`<div class="card"><h3>O que levas deste módulo</h3><ul>${t.d.sum.map(x=>`<li>${x}</li>`).join("")}</ul><p class="tag">${d} de ${n} exercícios com pontuação</p><br>${S.cur+1<T.length?`<button class="b" data-t="${S.cur+1}">Próximo módulo</button>`:""}</div>`:""};
const glos=()=>{const a=[];T.forEach(t=>t.d&&t.d.con.forEach(c=>a.push([c[0],c[1],t.n])));a.sort((x,y)=>x[0].localeCompare(y[0],"pt"));
 return `<div class="card"><h3>Método de estudo em 4 passos</h3><ol><li><b>Lê</b> o conceito e o caso.</li><li><b>Experimenta</b> no laboratório.</li><li><b>Responde</b> sem olhar a dica; depois confirma.</li><li><b>Explica</b> por palavras tuas a um colega.</li></ol></div><div class="card"><h3>Glossário</h3>${a.map(x=>`<p><b>${x[0]}</b> <span class="tag">${x[2]}</span><br>${x[1]}</p>`).join("")}</div>`};

/* ---------- Finais: conciliação, Benford, painel, certificado, impressão ---------- */
T[0].d.lab="Compara cada linha do extrato M-Pesa com o razão e escolhe o diagnóstico. Clica em «Verificar». Pergunta-te: o total chega para concluir que está tudo bem?";
W[0]=()=>{const C=["Conciliado","Valor diferente","Falta no razão","Duplicado","Desfasamento de data","Sem suporte no extrato"];
const Q=[["MP01",2500,2500,"12/03","12/03",0],["MP02",4650,4560,"12/03","12/03",1],["MP03",1200,null,"13/03","—",2],["MP04",8000,8000,"13/03","13/03",0],["MP05",3300,6600,"14/03","14/03",3],["MP06",5000,5000,"14/03","17/03",4],["MP07",null,2000,"—","15/03",5]];
const m=x=>x==null?"—":fm(x),te=Q.reduce((a,q)=>a+(q[1]||0),0),tr=Q.reduce((a,q)=>a+(q[2]||0),0);
$("#wg").innerHTML=`<h3>Conciliação: extrato M-Pesa vs razão</h3><p class="ins">Total do extrato: <b>${fm(te)} MT</b> · Total do razão: <b>${fm(tr)} MT</b> · Diferença: <b>${fm(tr-te)} MT</b>. Descobre de onde vem cada diferença.</p><div class="sc"><table><tr><th>Ref.</th><th>Extrato</th><th>Razão</th><th>Data extrato</th><th>Data razão</th><th>Diagnóstico</th><th></th></tr>${Q.map((q,i)=>`<tr><td>${q[0]}</td><td class="num">${m(q[1])}</td><td class="num">${m(q[2])}</td><td>${q[3]}</td><td>${q[4]}</td><td><select id="rc${i}"><option value="">Escolher...</option>${C.map((c,j)=>`<option value="${j}">${c}</option>`).join("")}</select></td><td id="rv${i}"></td></tr>`).join("")}</table></div><button class="b" id="vr">Verificar conciliação</button><div id="vo"></div>`;
$("#vr").onclick=()=>{let n=0;Q.forEach((q,i)=>{const v=gv("rc"+i),ok=v!==""&&+v==q[5];n+=ok;$("#rv"+i).innerHTML=ok?"<b style='color:var(--ok)'>Certo</b>":"<b class='no'>"+C[q[5]]+"</b>"});save("L",0,n/Q.length);
$("#vo").innerHTML=`<div class="fb"><b>${n}/${Q.length} diagnósticos certos.</b> Lição: o total sozinho engana, porque o duplicado (+3.300) e a omissão (−1.200) se compensam parcialmente. O auditor concilia linha a linha e pede o suporte de cada diferença.</div>`}};
const rkOf=q=>q<.25?"Estagiário":q<.5?"Auditor Júnior":q<.75?"Auditor Sénior":"Sócio-auditor";
const stat=()=>{let tot=0,n=0;T.forEach((t,a)=>t.it.forEach((_,b)=>{n++;tot+=best(a,b)}));return{tot,n,q:tot/n,rk:rkOf(tot/n)}};
const sv2=()=>{try{localStorage.setItem("aud",JSON.stringify(sv))}catch(e){}};
T.push({n:"Painel",t:"Resultados e certificado",pn:true,case:"Acompanha o teu progresso, imprime o certificado e prepara-te para a avaliação.",it:[]});
const painel=()=>{const s=stat();return `<div class="card"><h3>O teu desempenho</h3>${T.map((t,a)=>{if(!t.it.length)return "";let x=0;t.it.forEach((_,b)=>x+=best(a,b));return `<div class="cl"><span>${t.n}: ${t.t}</span><span class="num">${x.toFixed(1)}/${t.it.length}</span><div class="bar" style="flex:1 1 100%"><i style="width:${x/t.it.length*100}%"></i></div></div>`}).join("")}<p><b>Nível: ${s.rk}</b> · ${s.tot.toFixed(1)}/${s.n} pontos · Conciliação M-Pesa: ${Math.round(best("L",0)*100)}%</p></div><div class="card"><h3>Certificado de participação</h3><p class="ins">Escreve o teu nome. O certificado é emitido a partir de 60% da pontuação (${s.q>=.6?"já atingiste":"ainda faltam "+Math.ceil(s.n*.6-s.tot)+" pontos"}). Na janela de impressão escolhe «Guardar como PDF».</p><label class="fld">Nome completo<input id="nm" value="${esc(sv.nome||"")}"></label><button class="b" data-pr="cert" ${s.q>=.6?"":"disabled"}>Imprimir certificado</button><button class="b s" data-pr="reset">Apagar progresso</button></div>`};
const PR=k=>{if(k=="reset"){if(confirm("Apagar toda a pontuação guardada neste navegador?")){sv={};try{localStorage.removeItem("aud")}catch(e){}render()}return}
 const nm=gv("nm").trim();if(!nm)return alert("Escreve o teu nome.");sv.nome=nm;sv2();const s=stat();
 $("#pv").innerHTML=`<div style="border:6px double #0a1f7a;padding:2.5rem;text-align:center;font-family:Georgia,serif;color:#000;background:#fff"><h1 style="font-size:2rem">Certificado de Participação</h1><p>Certifica-se que</p><h2 style="font-size:1.8rem">${esc(nm)}</h2><p>concluiu o <b>AudiLab, Simulador de Auditoria Informática</b> (6 temas e laboratório mini-ERP), com a pontuação de <b>${s.tot.toFixed(1)} / ${s.n}</b> e o nível de <b>${s.rk}</b>.</p><p>${new Date().toLocaleDateString("pt-PT")}</p></div>`;window.print()};
A.prt=()=>{const o=AU();$("#pv").innerHTML=`<h1>Relatório de auditoria (simulação)</h1><p>Auditor: ${esc(sv.nome||"—")} · ${new Date().toLocaleDateString("pt-PT")}</p><p>Âmbito: ${ER.F.length} fornecedores, ${ER.V.length} faturas, ${ER.P.length} pagamentos e ${ER.L.length} registos de log.</p>`+(o.length?`<table><tr><th>Gravidade</th><th>Achado</th><th>Detalhe</th></tr>${o.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td></tr>`).join("")}</table>`:"<p>Sem alertas.</p>")+"<p><i>Alertas são indícios, não prova: confirmar com evidência independente antes de concluir.</i></p>";window.print()};
A.csv=()=>{const r=["id;fornecedor;valor;data;hora;estado;criado_por;aprovado_por",...ER.P.map(p=>[p.id,vf(p.v).n,p.val,p.d,p.h,p.st,UN[p.ator],p.aprov?UN[p.aprov]:""].join(";"))].join("\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+r],{type:"text/csv"}));a.download="pagamentos.csv";a.click()};

T[1].it[0].o=T[1].it[0].tr.map(r=>r[0]);
render();
</script>
